{{ define "main" }}

<section class="events-page-hero">

  <div class="events-page-hero-overlay">

    <p class="section-label">EVENTS</p>

    <h1>Chi Tau Tau Events</h1>

    <p class="events-page-subtitle">
      Stay connected with upcoming chapter events and activities.
    </p>

  </div>

</section>


<section class="events-calendar-section">

  <div class="events-calendar-container">

    <p class="section-label">EVENT CALENDAR</p>

    <h2>Upcoming Chapter Events</h2>

    <div class="section-divider"></div>

   <div class="calendar">

  <div class="calendar-header">

    <button class="calendar-nav" id="prev-month">
      &#10094;
    </button>

    <h3 id="calendar-month">
      September 2026
    </h3>

    <button class="calendar-nav" id="next-month">
      &#10095;
    </button>

  </div>

  <div class="calendar-grid" id="calendar-grid"></div>

</div>

  </div>

</section>

<!-- ===== UPCOMING EVENTS ===== -->
<section class="upcoming-events-section">

    <h2>Upcoming Events</h2>

    <div class="events-carousel">

        <button class="event-arrow" id="prev-event">&#10094;</button>

        <div class="events-page-card">

            <div class="events-page-flyer">
                <img
                    id="event-flyer"
                    src="/images/Interest-meeting-flyer-sept-21st.PNG"
                    alt="Interest Meeting Flyer"
                >
            </div>

            <div class="events-page-info">
                <h3 id="event-title">Interest Meeting</h3>
                <p id="event-date"><strong>September 21, 2026</strong></p>
            </div>

        </div>

        <button class="event-arrow" id="next-event">&#10095;</button>

    </div>

</section>

<script>
  const calendarMonth = document.getElementById("calendar-month");
  const calendarGrid = document.getElementById("calendar-grid");
  const prevButton = document.getElementById("prev-month");
  const nextButton = document.getElementById("next-month");

  let currentDate = new Date(2026, 8, 1); // September 2026
  
 const events = {
    "2026-09-21": {
        title: "Interest Meeting",
        flyer: "/images/Interest-meeting-flyer-sept-21st.PNG"
    },

    "2026-09-27": {
        title: "Pageant Informational",
        flyer: "/images/pageant-flyer-27th..png"
    },

    "2026-10-20": {
        title: "BARQ Radio",
        flyer: "/images/BARQ-Radio.png"
    }
};

  function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    calendarGrid.style.display = "grid";
    calendarGrid.style.gridTemplateColumns = "repeat(7, 1fr)";
    calendarGrid.style.gap = "10px";
    calendarGrid.style.width = "100%";  

    const monthNames = [
      "January", "February", "March", "April",
      "May", "June", "July", "August",
      "September", "October", "November", "December"
    ];

    calendarMonth.textContent = `${monthNames[month]} ${year}`;

    calendarGrid.innerHTML = `
      <div class="calendar-day-name">Sun</div>
      <div class="calendar-day-name">Mon</div>
      <div class="calendar-day-name">Tue</div>
      <div class="calendar-day-name">Wed</div>
      <div class="calendar-day-name">Thu</div>
      <div class="calendar-day-name">Fri</div>
      <div class="calendar-day-name">Sat</div>
    `;

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    for (let i = 0; i < firstDay; i++) {
      calendarGrid.innerHTML += `<div class="calendar-day empty"></div>`;
    }

    for (let day = 1; day <= daysInMonth; day++) {

    const dateKey =
        `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;

    const event = events[dateKey];

    if (event) {
        calendarGrid.innerHTML += `
            <div class="calendar-day event-day">
                <span class="day-number">${day}</span>
                <span class="event-title">${event.title}</span>
            </div>
        `;
    } else {
        calendarGrid.innerHTML += `
            <div class="calendar-day">
                <span class="day-number">${day}</span>
            </div>
        `;
    }
}
  }

  prevButton.addEventListener("click", function() {
    currentDate.setMonth(currentDate.getMonth() - 1);
    renderCalendar();
  });

  nextButton.addEventListener("click", function() {
    currentDate.setMonth(currentDate.getMonth() + 1);
    renderCalendar();
  });

  renderCalendar();

  // ===== UPCOMING EVENTS CAROUSEL =====

const upcomingEvents = [
    {
        title: "Interest Meeting",
        date: "September 21, 2026",
        flyer: "/images/Interest-meeting-flyer-sept-21st.PNG"
    },
    {
        title: "Pageant Informational",
        date: "September 27, 2026",
        flyer: "/images/pageant-flyer-27th..png"
    },
    {
        title: "BARQ Radio",
        date: "October 20, 2026",
        flyer: "/images/BARQ-Radio.png"
    }
];

let currentEventIndex = 0;

const eventFlyer = document.getElementById("event-flyer");
const eventTitle = document.getElementById("event-title");
const eventDate = document.getElementById("event-date");
const prevEventButton = document.getElementById("prev-event");
const nextEventButton = document.getElementById("next-event");

function showEvent(index) {
    const event = upcomingEvents[index];

    eventFlyer.src = event.flyer;
    eventFlyer.alt = `${event.title} Flyer`;
    eventTitle.textContent = event.title;
    eventDate.innerHTML = `<strong>${event.date}</strong>`;
}

nextEventButton.addEventListener("click", function () {
    currentEventIndex++;

    if (currentEventIndex >= upcomingEvents.length) {
        currentEventIndex = 0;
    }

    showEvent(currentEventIndex);
});

prevEventButton.addEventListener("click", function () {
    currentEventIndex--;

    if (currentEventIndex < 0) {
        currentEventIndex = upcomingEvents.length - 1;
    }

    showEvent(currentEventIndex);
});

showEvent(currentEventIndex);
</script>

{{ end }}
