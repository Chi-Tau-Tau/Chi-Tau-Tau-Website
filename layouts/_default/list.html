{{ define "main" }}

<section class="page-section">
  <div class="page-container">

    <h1>{{ .Title }}</h1>

    <div class="page-content">
      {{ .Content }}
    </div>

    {{ range .Pages }}
      <article class="content-card">
        <h2>
          <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        </h2>

        <p>{{ .Summary }}</p>
      </article>
    {{ end }}

  </div>
</section>

{{ end }}
